<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1a1a2e" />
<title>Personal Brain</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  /* ---------- Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, textarea { font: inherit; color: inherit; }
  ul { list-style: none; padding: 0; margin: 0; }
  a { color: inherit; text-decoration: none; }

  /* ---------- Tokens ---------- */
  :root {
    --bg: #ffffff;
    --bg-soft: #f6f7f9;
    --bg-capture: #f3f5fb;
    --text: #1a1a1a;
    --text-2: #4a4a52;
    --text-3: #8a8a93;
    --line: #ececef;
    --line-2: #e3e3e7;
    --primary: #1a1a2e;
    --primary-soft: #eceaf3;
    --bubble-user: #1a1a2e;
    --bubble-ai: #f6f7f9;
    --shadow: 0 8px 24px rgba(20, 20, 40, 0.08);
    --radius: 14px;
    --radius-sm: 10px;
    --radius-lg: 20px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: #eef0f3;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- App Frame ---------- */
  .app {
    position: relative;
    width: 100%;
    max-width: 390px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 480px) {
    body { padding: 24px 0; background: #eef0f3; }
    .app {
      height: min(844px, calc(100vh - 48px));
      border-radius: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }
  }

  .page {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }
  .page.active { display: flex; }

  /* ---------- Page: Home ---------- */
  .home-header {
    padding: 22px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .home-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .home-title .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--primary);
    margin-right: 8px;
    transform: translateY(-2px);
  }
  .home-sub {
    font-size: 13px;
    color: var(--text-3);
  }

  .home-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 120px;
    -webkit-overflow-scrolling: touch;
  }

  /* Review card */
  .review-card {
    position: relative;
    background: var(--primary);
    color: #fff;
    border-radius: var(--radius-lg);
    padding: 14px 16px 14px;
    margin-bottom: 22px;
    overflow: hidden;
  }
  .review-card::after {
    content: "";
    position: absolute;
    right: -40px; top: -40px;
    width: 140px; height: 140px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), transparent 60%);
    border-radius: 50%;
    pointer-events: none;
  }
  .review-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.65;
    margin-bottom: 10px;
  }
  .review-split {
    display: flex;
    gap: 10px;
    align-items: stretch;
    min-height: 72px;
  }
  .review-left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .review-right {
    flex: 0 0 44%;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 6px;
    transition: background 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .review-right:hover { background: rgba(255,255,255,0.18); }
  .review-right-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 6px;
  }
  .review-question-text {
    font-size: 13px;
    line-height: 1.5;
    color: #fff;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: opacity 0.2s ease;
  }
  .review-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .review-tag {
    background: rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.92);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .review-tag:hover { background: rgba(255,255,255,0.26); }

  /* Imagination overlay */
  .imag-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .imag-overlay.visible { opacity: 1; pointer-events: auto; }
    .imag-panel {
    position: fixed;
    left: 50%; bottom: 0;
    transform: translateX(-50%) translateY(100%);
    width: min(480px, 100vw);
    max-height: 85dvh;
    background: var(--bg);
    border-radius: 18px 18px 0 0;
    z-index: 201;
    display: flex;
    flex-direction: column;
    pointer-events: none;
    transition: transform 0.28s cubic-bezier(0.34,1.1,0.64,1);
    overflow: visible;
  }
  .imag-panel.visible { transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .imag-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .imag-header-left { display: flex; align-items: center; gap: 8px; }
  .imag-header-title { font-size: 14px; font-weight: 600; color: var(--text-1); }
  .imag-close {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--bg-2);
    color: var(--text-2);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .imag-close:hover { background: var(--line); }
  .imag-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
  .imag-carousel {
    background: var(--primary);
    border-radius: 12px;
    padding: 14px 16px 12px;
    color: #fff;
    position: relative;
    min-height: 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .imag-carousel-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 6px;
  }
  .imag-carousel-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.45;
    flex: 1;
    cursor: pointer;
    transition: opacity 0.3s ease;
  }
  .imag-carousel-title:hover { opacity: 0.8; }
  .imag-carousel-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .imag-nav-btn {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 13px;
    transition: background 0.15s;
  }
  .imag-nav-btn:hover { background: rgba(255,255,255,0.28); }
  .imag-carousel-dots { display: flex; gap: 4px; }
  .imag-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transition: background 0.2s;
  }
  .imag-dot.active { background: #fff; }
  .imag-section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .imag-question-box {
    background: var(--bg-2);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.5;
  }
  .imag-textarea {
    width: 100%;
    min-height: 100px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-1);
    background: var(--bg);
    resize: none;
    line-height: 1.6;
    box-sizing: border-box;
  }
  .imag-textarea:focus { outline: none; border-color: var(--primary); }
  .imag-footer {
    display: flex;
    gap: 8px;
    padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .imag-btn {
    flex: 1;
    border-radius: 999px;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s ease;
  }
  .imag-btn-secondary { background: var(--bg-2); color: var(--text-2); }
  .imag-btn-secondary:hover { background: var(--line); }
  .imag-btn-primary { background: var(--primary); color: #fff; }
  .imag-btn-primary:hover { opacity: 0.88; }
  .imag-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .imag-list-item {
    background: var(--bg-2);
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-1);
    transition: background 0.15s;
  }
  .imag-list-item:hover { background: var(--primary-soft); color: var(--primary); }
  .imag-new-form { display: flex; flex-direction: column; gap: 8px; }
  .imag-new-input {
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-1);
    background: var(--bg);
    box-sizing: border-box;
    width: 100%;
  }
  .imag-new-input:focus { outline: none; border-color: var(--primary); }

  /* Tasks card */
  .tasks-card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px 16px 12px;
    margin-bottom: 22px;
  }
  .tasks-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .tasks-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .tasks-title .count {
    font-size: 11px;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-soft);
    padding: 1px 7px;
    border-radius: 999px;
    min-width: 18px;
    text-align: center;
  }
  .tasks-add-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--bg-soft);
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
  }
  .tasks-add-btn:hover { background: var(--primary-soft); color: var(--primary); }
  .tasks-add-btn:active { transform: scale(0.92); }
  .tasks-add-btn.active { background: var(--primary); color: #fff; }

  .tasks-list { display: flex; flex-direction: column; }
  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 2px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: opacity 0.2s ease;
  }
  .task-item:last-child { border-bottom: none; }
  .task-checkbox {
    width: 18px; height: 18px;
    border: 1.6px solid var(--line-2);
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }
  .task-item:hover .task-checkbox { border-color: var(--text-3); }
  .task-item.done .task-checkbox { background: var(--primary); border-color: var(--primary); color: #fff; }
  .task-text {
    flex: 1;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    word-break: break-word;
    transition: color 0.2s ease;
  }
  .task-item.done .task-text { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }
  .task-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .task-item.done .task-meta { color: var(--line-2); }
  .tasks-empty { padding: 14px 4px; font-size: 13px; color: var(--text-3); text-align: center; }

  .tasks-add {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    padding: 6px 2px 2px;
    border-top: 1px dashed var(--line);
  }
  .tasks-add svg { color: var(--text-3); flex-shrink: 0; }
  .tasks-add input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 13px;
    color: var(--text);
    padding: 6px 0;
  }
  .tasks-add input::placeholder { color: var(--text-3); }

  /* History list */
  .section-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-3);
    letter-spacing: 0.06em;
    margin: 4px 4px 10px;
    text-transform: uppercase;
  }
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-item {
    background: var(--bg-soft);
    border-radius: var(--radius);
    padding: 11px 10px 11px 14px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .history-item:active { transform: scale(0.99); background: #eef0f3; }
  .h-time {
    flex-shrink: 0;
    width: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .h-day { font-size: 11px; font-weight: 500; color: var(--text-3); line-height: 1.2; }
  .h-clock { font-size: 10px; color: var(--text-3); opacity: 0.65; }
  .h-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .h-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .h-preview {
    font-size: 12px;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Bottom input bar (home) */
  .home-input-wrap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, rgba(255,255,255,0));
    pointer-events: none;
  }
  .home-input {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 14px;
    box-shadow: 0 4px 16px rgba(20,20,40,0.04);
  }
  .home-input input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 15px;
    color: var(--text);
  }
  .home-input input::placeholder { color: var(--text-3); }
  .home-input .send-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- Page: Chat ---------- */
  .chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 14px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2);
    transition: background 0.15s ease;
  }
  .back-btn:active { background: var(--bg-soft); }
  .chat-title {
    font-size: 15px;
    font-weight: 500;
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 16px;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* Messages */
  .msg { display: flex; max-width: 100%; }
  .msg.user { justify-content: flex-end; }
  .msg.ai { justify-content: flex-start; flex-direction: column; align-items: flex-start; }

  .bubble {
    max-width: 84%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.55;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .msg.ai .bubble {
    background: var(--bubble-ai);
    color: var(--text);
    border-bottom-left-radius: 6px;
    width: 100%;
  }

  /* Markdown inside AI bubble */
  .bubble.md p { margin: 0 0 10px; }
  .bubble.md p:last-child { margin-bottom: 0; }
  .bubble.md h1, .bubble.md h2, .bubble.md h3 { font-size: 15px; font-weight: 600; margin: 14px 0 6px; }
  .bubble.md ul, .bubble.md ol { padding-left: 20px; margin: 6px 0 10px; }
  .bubble.md li { margin: 3px 0; }
  .bubble.md code {
    background: rgba(0,0,0,0.06);
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .bubble.md pre {
    background: #1a1a2e;
    color: #eaeaf2;
    padding: 12px 14px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 13px;
    margin: 8px 0;
  }
  .bubble.md pre code { background: transparent; padding: 0; color: inherit; }
  .bubble.md a { color: var(--primary); text-decoration: underline; }
  .bubble.md strong { font-weight: 600; }
  .bubble.md blockquote {
    border-left: 3px solid var(--line-2);
    padding-left: 10px;
    color: var(--text-2);
    margin: 8px 0;
  }

  /* AI reply meta */
  .ai-meta {
    width: 100%;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sources {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg);
  }
  .sources-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    cursor: pointer;
    user-select: none;
  }
  .sources-head .label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-2); font-weight: 500;
  }
  .sources-head .badge {
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 600;
  }
  .chev { transition: transform 0.2s ease; color: var(--text-3); }
  .sources.open .chev { transform: rotate(180deg); }
  .sources-list { display: none; border-top: 1px solid var(--line); }
  .sources.open .sources-list { display: block; }
  .source-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .source-item:first-child { border-top: none; }
  .source-item:active { background: var(--bg-soft); }
  .source-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--primary-soft);
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .source-info { flex: 1; min-width: 0; }
  .source-name {
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
  .source-snippet {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ai-actions { display: flex; gap: 6px; }
  .note-action-confirm {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--primary);
    padding: 5px 10px;
    background: var(--primary-soft);
    border-radius: 999px;
    margin: 4px 0;
  }
  .note-action-undo {
    font-size: 11px;
    color: var(--text-3);
    text-decoration: underline;
    background: none;
    padding: 0;
  }
  .note-action-undo:hover { color: var(--text-1); }
  .save-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text-3);
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    transition: all 0.18s ease;
  }
  .save-btn:hover { color: var(--primary); border-color: var(--primary-soft); background: var(--primary-soft); }
  .save-btn.saved { color: var(--primary); border-color: var(--primary-soft); background: var(--primary-soft); }

  /* Chat input */
  .chat-input-wrap {
    border-top: 1px solid var(--line);
    background: var(--bg);
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    transition: background 0.25s ease;
  }
  .chat-input-wrap.capture { background: var(--bg-capture); }
  .chat-scroll { transition: background 0.25s ease; }
  .chat-scroll.capture-mode { background: var(--bg-capture); }
  .chat-input {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 8px 8px 8px 14px;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .chat-input-wrap.capture .chat-input { background: #fff; border-color: #d6dcef; }
  .chat-input textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-size: 15px;
    line-height: 1.45;
    color: var(--text);
    max-height: 120px;
    min-height: 22px;
    padding: 4px 0;
    font-family: inherit;
  }
  .chat-input textarea::placeholder { color: var(--text-3); }
  .input-actions { display: flex; gap: 6px; align-items: center; }
  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2);
    background: transparent;
    transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.capture-toggle.active { background: var(--primary); color: #fff; }
  .send-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn:not(:disabled):active { transform: scale(0.92); }

  /* Selection quote */
  #quote-btn {
    position: fixed;
    z-index: 300;
    background: var(--text-1);
    color: var(--bg);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    pointer-events: auto;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  #quote-btn.visible { opacity: 1; transform: translateY(0); }
  .quote-block {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 10px;
    margin: 0 0 6px;
    background: var(--bg-2);
    border-left: 3px solid var(--primary);
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.5;
  }
  .quote-block-text {
    flex: 1;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 60px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .quote-dismiss {
    flex-shrink: 0;
    color: var(--text-3);
    font-size: 16px;
    line-height: 1;
    padding: 0 2px;
    background: none;
  }
  .quote-dismiss:hover { color: var(--text-1); }
  .stop-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--text-2);
    color: #fff;
    display: none;
    align-items: center; justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .stop-btn:active { background: #333; transform: scale(0.92); }

  @keyframes captureFlash {
    0%   { background: var(--bg-capture); }
    50%  { background: #e6ecff; }
    100% { background: var(--bg-capture); }
  }

  /* ---------- Drawer ---------- */
  .drawer-mask {
    position: absolute;
    inset: 0;
    background: rgba(20,20,40,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 50;
  }
  .drawer-mask.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-top-left-radius: 22px;
    border-top-right-radius: 22px;
    max-height: 80%;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 51;
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateY(0); }
  .drawer-handle {
    width: 36px; height: 4px;
    background: var(--line-2);
    border-radius: 2px;
    margin: 10px auto 4px;
  }
  .drawer-head {
    padding: 8px 18px 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  .drawer-title { font-size: 16px; font-weight: 600; line-height: 1.35; flex: 1; word-break: break-word; }
  .drawer-meta { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .drawer-close {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--bg-soft);
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .drawer-body {
    padding: 16px 18px 28px;
    overflow-y: auto;
    flex: 1;
    -webkit-overflow-scrolling: touch;
  }
  .drawer-body p { margin: 0 0 12px; line-height: 1.65; font-size: 15px; color: var(--text-2); }
  .drawer-body h1, .drawer-body h2, .drawer-body h3 { font-size: 15px; font-weight: 600; margin: 16px 0 8px; color: var(--text); }
  .drawer-body ul { padding-left: 20px; margin: 6px 0 12px; }
  .drawer-body li { margin: 4px 0; line-height: 1.6; color: var(--text-2); font-size: 15px; }
  .drawer-body code {
    background: var(--bg-soft);
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .drawer-body strong { font-weight: 600; color: var(--text); }

  /* Toast */
  .toast {
    position: absolute;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%) translateY(20px);
    background: var(--primary);
    color: #fff;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 60;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes fade {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }
  .placeholder-fade { animation: fade 0.25s ease; }

  /* ---------- Remind picker (in chat bubble) ---------- */
  .remind-picker { display: flex; flex-direction: column; gap: 10px; }
  .remind-label { font-size: 14px; color: var(--text-2); line-height: 1.5; }
  .remind-options {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .remind-opt {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    font-size: 13px;
    color: var(--text-2);
    background: var(--bg);
    transition: all 0.15s ease;
    cursor: pointer;
  }
  .remind-opt:hover, .remind-opt:active {
    background: var(--primary-soft);
    border-color: var(--primary-soft);
    color: var(--primary);
  }
  .remind-opt.selected {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .remind-confirm { font-size: 13px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
  .remind-confirm svg { color: var(--primary); }

  /* ---------- History delete button ---------- */
  .history-del {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    line-height: 1;
    color: var(--text-3);
    background: transparent;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .history-del:hover { background: #fde8e8; color: #c0392b; }
  .history-del.confirming { background: #c0392b; color: #fff; }

  /* ---------- Task action buttons ---------- */
  .task-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    align-items: center;
    margin-top: 1px;
  }
  .task-action-btn {
    font-size: 11px;
    color: var(--text-3);
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    transition: all 0.15s ease;
    cursor: pointer;
    white-space: nowrap;
  }
  .task-action-btn:hover { color: var(--primary); border-color: var(--primary-soft); background: var(--primary-soft); }
  .task-action-btn.done-btn:hover { color: #2a9d2a; border-color: #d0ead0; background: #f0f8f0; }

  /* ---------- Mode toggle ---------- */
  .mode-toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    padding: 0;
    background: none;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .mode-toggle:active { opacity: 0.65; }
  .mode-icon {
    color: var(--text-3);
    flex-shrink: 0;
    transition: color 0.2s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .mode-toggle:hover .mode-icon { color: var(--primary); transform: rotate(20deg) scale(1.1); }

  /* ---------- Lab grid (Lightning mode) ---------- */
  .lab-grid {
    columns: 2;
    column-gap: 10px;
    padding: 4px 0 8px;
  }
  .lab-section-header {
    column-span: all;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 14px 0 6px;
    break-inside: avoid;
  }
  .lab-section-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .lab-section-header:first-child { margin-top: 4px; }
  .lab-card {
    break-inside: avoid;
    display: inline-block;
    width: 100%;
    margin-bottom: 10px;
    background: var(--bg-soft);
    border-radius: var(--radius);
    padding: 12px 12px 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
    vertical-align: top;
  }
  .lab-card:active { transform: scale(0.98); background: #eef0f3; }
  .lab-status {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 999px;
    margin-bottom: 7px;
  }
  .lab-status.s-incubating { background: #fff8e6; color: #b37700; }
  .lab-status.s-done       { background: #e6f7ef; color: #1a7a45; }
  .lab-status.s-shelved    { background: var(--bg-soft); color: var(--text-3); border: 1px solid var(--line); }
  .lab-card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 5px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .lab-card-preview {
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .lab-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 10px;
    color: var(--text-3);
  }
  .lab-card-meta { flex: 1; min-width: 0; }
  .lab-card-actions { display: flex; gap: 5px; flex-shrink: 0; }
  .lab-action {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--text-3);
    background: var(--bg);
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .lab-action.done-btn:hover  { color: #1a7a45; border-color: #a3d9bc; background: #e6f7ef; }
  .lab-action.shelf-btn:hover { color: var(--text-2); background: var(--bg-soft); }
  .lab-card.is-shelved { opacity: 0.42; }

  /* ---------- Drawer chat button ---------- */
  .drawer-chat-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    color: var(--primary);
    background: var(--primary-soft);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  .drawer-chat-btn:hover { background: #ddd9f0; }

  /* ---------- Chat context bar ---------- */
  .chat-context-bar {
    padding: 7px 14px;
    background: var(--primary-soft);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--primary);
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .chat-context-bar:hover { background: #ddd9f0; }
  .chat-context-bar svg { flex-shrink: 0; opacity: 0.8; }
</style>
</head>

<div class="app" id="app">

  <!-- =================== PAGE: HOME =================== -->
  <section class="page active" id="page-home">

      <!-- History -->

      </div>

      <div class="lab-grid" id="lab-grid"></div>

    <!-- Bottom input -->
    <div class="home-input-wrap">
      <form class="home-input" id="home-input-form">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="home-input" type="text" placeholder="问点什么，或记录一个想法…" autocomplete="off" />
        <button type="submit" class="send-icon" aria-label="发送">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>
        </button>
      </form>
    </div>
  </section>

  <!-- =================== PAGE: CHAT =================== -->
  <section class="page" id="page-chat">
    <header class="chat-header">
      <button class="back-btn" id="back-btn" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </button>
      <div class="chat-title" id="chat-title">新对话</div>
    </header>

    <div class="chat-context-bar" id="chat-context-bar" style="display:none;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4.09 13H11L10 22L20.91 11H14L13 2Z"/></svg>
      <span id="chat-context-title"></span>
    </div>

    <div class="chat-scroll" id="chat-scroll"></div>

    <div class="chat-input-wrap" id="chat-input-wrap">
      <div class="chat-input">
        <div id="quote-block" style="display:none"></div>
        <textarea id="chat-input" rows="1" placeholder="问点什么..."></textarea>
        <div class="input-actions">
          <button class="icon-btn capture-toggle" id="capture-toggle" aria-label="切换捕获模式">

          </button>
          <button class="send-btn" id="send-btn" disabled aria-label="发送">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>

<script>
/* =========================================================
   Config
   ========================================================= */
const API_BASE = '';

/* =========================================================
   Helpers
   ========================================================= */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m]
  );
}

function formatRelativeTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const dStart = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const hm = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  if (dStart === todayStart) return '今天 ' + hm;
  if (dStart === todayStart - 86400000) return '昨天 ' + hm;
  return `${d.getMonth() + 1} 月 ${d.getDate()} 日`;
}

function formatTimeParts(ts) {
  const d = new Date(ts);
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const dStart = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const hm = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  if (dStart === todayStart) return { day: '今天', time: hm };
  if (dStart === todayStart - 86400000) return { day: '昨天', time: hm };
  return { day: `${d.getMonth() + 1}/${d.getDate()}`, time: null };
}

async function renderHistory() {
  let convs = [];
  try {
    const res = await fetch(`${API_BASE}/api/conversations`);
    convs = await res.json();
  } catch { /* silent */ }

  historyCount.textContent = convs.length || '';

  if (convs.length === 0) {
    historyList.innerHTML = `<li style="padding:14px 4px;font-size:13px;color:var(--text-3);text-align:center;">还没有对话记录</li>`;
    return;
  }
  historyList.innerHTML = convs.map(c => {
    const { day, time } = formatTimeParts(c.updatedAt);
    return `
    <li class="history-item" data-id="${escapeHtml(c.id)}">
      <div class="h-time">
        <span class="h-day">${escapeHtml(day)}</span>
        ${time ? `<span class="h-clock">${escapeHtml(time)}</span>` : ''}
      </div>
      <div class="h-body">
        <div class="h-title">${escapeHtml(c.title)}</div>
        ${c.preview ? `<div class="h-preview">${escapeHtml(c.preview)}</div>` : ''}
      </div>
      <button class="history-del" data-id="${escapeHtml(c.id)}" aria-label="删除对话">×</button>
    </li>`;
  }).join('');

  historyList.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.history-del')) return;
      openConversation({ id: el.getAttribute('data-id') });
    });
  });

  const confirmTimers = {};
  historyList.querySelectorAll('.history-del').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      if (!btn.classList.contains('confirming')) {
        btn.classList.add('confirming');
        btn.textContent = '确认删除';
        confirmTimers[id] = setTimeout(() => {
          btn.classList.remove('confirming');
          btn.textContent = '×';
        }, 2000);
      } else {
        clearTimeout(confirmTimers[id]);
        btn.textContent = '…';
        btn.disabled = true;
        try {
          await fetch(`${API_BASE}/api/conversations/${encodeURIComponent(id)}`, { method: 'DELETE' });
          showToast('已删除');
          renderHistory();
        } catch {
          showToast('删除失败');
          btn.classList.remove('confirming');
          btn.textContent = '×';
          btn.disabled = false;
        }
      }
    });
  });
}

/* Reminder date helpers */
function todayStr() { return new Date().toISOString().slice(0, 10); }
function offsetDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function formatRemindDate(dateStr) {
  const today = todayStr();
  const tomorrow = offsetDate(1);
  if (dateStr === today)    return '今天提醒';
  if (dateStr === tomorrow) return '明天提醒';
  return `${dateStr.slice(5).replace('-', ' 月 ')} 日提醒`;
}

async function renderTasks() {
  tasksListEl.innerHTML = `<li class="tasks-empty" style="color:var(--text-3)">加载中…</li>`;
  let reminders = [];
  try {
    const res = await fetch(`${API_BASE}/api/reminders`);
    reminders = await res.json();
  } catch {
    tasksListEl.innerHTML = `<li class="tasks-empty">无法加载提醒</li>`;
    return;
  }

  tasksCountEl.textContent = reminders.length;

  if (reminders.length === 0) {
    tasksListEl.innerHTML = `<li class="tasks-empty">今天没有待处理的提醒</li>`;
    return;
  }

  tasksListEl.innerHTML = reminders.map(t => `
    <li class="task-item" data-id="${escapeHtml(t.id)}">
      <span class="task-checkbox">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
      <div style="flex:1;min-width:0;">
        <div class="task-text">${escapeHtml(t.content)}</div>
        <div class="task-meta">${escapeHtml(formatRemindDate(t.remind))}</div>
      </div>
      <div class="task-actions">
        <button class="task-action-btn snooze-btn" data-id="${escapeHtml(t.id)}" title="推迟到明天">明天</button>
        <button class="task-action-btn done-btn" data-id="${escapeHtml(t.id)}" title="完成并归档">完成</button>
      </div>
    </li>
  `).join('');

  tasksListEl.querySelectorAll('.done-btn').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      btn.textContent = '…'; btn.disabled = true;
      await patchReminder(id, { status: 'done' });
      renderTasks();
    });
  });
  tasksListEl.querySelectorAll('.snooze-btn').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      btn.textContent = '…'; btn.disabled = true;
      await patchReminder(id, { remind: offsetDate(1) });
      showToast('已推迟到明天');
      renderTasks();
    });
  });
}

async function patchReminder(filename, body) {
  try {
    await fetch(`${API_BASE}/api/reminders/${encodeURIComponent(filename)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  } catch (err) { console.error(err); }
}

function openTaskAdd() {

  tasksAddToggle.classList.add('active');

function closeTaskAdd() {
  tasksAddRow.style.display = 'none';
  tasksAddToggle.classList.remove('active');
  tasksAddInput.value = '';
}
tasksAddToggle.addEventListener('click', () => {
  tasksAddRow.style.display === 'none' ? openTaskAdd() : closeTaskAdd();

let tasksInputComposing = false;
tasksAddInput.addEventListener('compositionstart', () => { tasksInputComposing = true; });
tasksAddInput.addEventListener('compositionend',   () => { tasksInputComposing = false; });

tasksAddInput.addEventListener('keydown', async e => {
  if (e.key === 'Enter' && !tasksInputComposing) {
    e.preventDefault();
    const v = tasksAddInput.value.trim();
    if (!v) return;
    tasksAddInput.disabled = true;
    try {
      await fetch(`${API_BASE}/api/reminders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: v, remind: todayStr() }),
      });
      showToast('已添加');
    } catch { showToast('添加失败'); }
    tasksAddInput.value = '';
    tasksAddInput.disabled = false;
    closeTaskAdd();
    renderTasks();
  } else if (e.key === 'Escape') {
    closeTaskAdd();
  }
});

/* =========================================================

   ========================================================= */
async function openConversation(item) {
  // If the caller only has an id, fetch the full record from backend
  let full = item.messages ? item : null;
  if (!full) {
    try {
      const res = await fetch(`${API_BASE}/api/conversations/${encodeURIComponent(item.id)}`);
      full = await res.json();
    } catch { full = { id: item.id, title: item.title || '对话', messages: [] }; }
  }

  // Backend stores role as 'assistant'; map back to 'ai' for the UI
  state.conversation.id      = full.id;
  state.conversation.title   = full.title || '对话';
  state.conversation.messages = (full.messages || []).map(m => ({
    ...m,
    role: m.role === 'assistant' ? 'ai' : m.role,
  }));
  chatTitleEl.textContent = state.conversation.title;
  renderMessages();
  goPage('chat');
}

function startNewConversation(initialText) {
  state.conversation.id       = 'c' + Date.now();
  state.conversation.title    = initialText
    ? (initialText.length > 18 ? initialText.slice(0, 18) + '…' : initialText)
    : '新对话';
  state.conversation.messages = [];
  state.conversation.labFileId = null;
  state.conversation.labContext = null;
  chatContextBar.style.display = 'none';
  chatTitleEl.textContent = state.conversation.title;
  clearQuote();
  renderMessages();
  goPage('chat');
  if (initialText) setTimeout(() => sendMessage(initialText), 50);
}

/* =========================================================
   Persist conversation to backend
   ========================================================= */
function persistConversation() {
  const SPECIAL = ['…', '__remind-picker__', '__note-saved__', '__note-modified__'];
  if (!state.conversation.messages.some(m => m.role === 'ai' && !SPECIAL.includes(m.content))) return;
  // Fire-and-forget — don't block the UI
  fetch(`${API_BASE}/api/conversations`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      id:       state.conversation.id,
      title:    state.conversation.title,
      messages: state.conversation.messages,
    }),
  }).catch(console.error);
}

/* =========================================================
   Render messages
   ========================================================= */
function renderMessages() {
  chatScroll.innerHTML = '';

  if (state.conversation.messages.length === 0) {
    const hint = document.createElement('div');
    hint.style.cssText = 'padding:40px 16px;text-align:center;color:var(--text-3);font-size:14px;line-height:1.7;';
    hint.textContent = '你好，问我任何关于你笔记的问题。';
    chatScroll.appendChild(hint);
    return;
  }

  state.conversation.messages.forEach(m => chatScroll.appendChild(buildMessageNode(m)));
  scrollToBottom(false);
}

function buildMessageNode(m) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${m.role}`;

  if (m.role === 'user') {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    // Render quoted prefix「…」\n\n separately
    const quoteMatch = m.content.match(/^「([\s\S]+?)」\n\n([\s\S]*)$/);
    if (quoteMatch) {
      const qb = document.createElement('div');
      qb.className = 'quote-block';
      qb.style.marginBottom = '6px';
      qb.innerHTML = `<span class="quote-block-text">${escapeHtml(quoteMatch[1])}</span>`;
      bubble.appendChild(qb);
      const qt = document.createElement('span');
      qt.textContent = quoteMatch[2];
      bubble.appendChild(qt);
    } else {
      bubble.textContent = m.content;
    }
    wrap.appendChild(bubble);
    return wrap;
  }

  // Remind picker (capture mode)
  if (m.content === '__remind-picker__') {
    wrap.appendChild(buildRemindPickerNode(m));
    return wrap;
  }

  // Auto note-save confirmation
  if (m.content === '__note-saved__') {
    wrap.appendChild(buildNoteSavedNode(m));
    return wrap;
  }

  // Auto note-modify confirmation
  if (m.content === '__note-modified__') {
    wrap.appendChild(buildNoteModifiedNode(m));
    return wrap;
  }

  // AI message
  const bubble = document.createElement('div');
  bubble.className = 'bubble md';
  if (m.content === '…') {
    bubble.innerHTML = '<span style="color:var(--text-3)">思考中…</span>';
  } else {
    bubble.innerHTML = window.marked ? marked.parse(m.content) : escapeHtml(m.content);
  }
  wrap.appendChild(bubble);

  if (m.content === '…') return wrap;

  const meta = document.createElement('div');
  meta.className = 'ai-meta';

  if (m.sources && m.sources.length) meta.appendChild(buildSourcesBlock(m.sources));

  const actions = document.createElement('div');
  actions.className = 'ai-actions';
  actions.appendChild(buildSaveBtn(m));
  if (state.conversation.labFileId) actions.appendChild(buildSaveToNoteBtn(m));
  meta.appendChild(actions);
  wrap.appendChild(meta);
  return wrap;
}

function buildSaveBtn(msgObj) {
  const btn = document.createElement('button');
  btn.className = 'save-btn' + (msgObj.saved ? ' saved' : '');
  const iconBookmark = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
  const iconCheck    = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

  btn.innerHTML = msgObj.saved ? `${iconCheck} 已存入` : `${iconBookmark} 存入记忆`;

  if (!msgObj.saved) {
    btn.addEventListener('click', async () => {
      if (btn.classList.contains('saved')) return;
      btn.disabled = true;
      btn.textContent = '保存中…';

      const msgs = state.conversation.messages;
      const myIdx = msgs.indexOf(msgObj);
      const userMsg = myIdx > 0
        ? [...msgs.slice(0, myIdx)].reverse().find(x => x.role === 'user')
        : null;

      try {
        await fetch(`${API_BASE}/api/save-memory`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: userMsg?.content || '', answer: msgObj.content }),
        });
        msgObj.saved = true;
        btn.classList.add('saved');
        btn.innerHTML = `${iconCheck} 已存入`;
        btn.disabled = false;
        showToast('已存入记忆');
        persistConversation();
      } catch {
        btn.disabled = false;
        btn.innerHTML = `${iconBookmark} 存入记忆`;
        showToast('保存失败，请重试');
      }
    });
  }
  return btn;
}

function buildSaveToNoteBtn(msgObj) {
  const iconNote  = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>`;
  const iconCheck = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

  const btn = document.createElement('button');

  function render() {
    btn.disabled = false;
    if (msgObj.savedToNote) {
      btn.className = 'save-btn saved';
      btn.innerHTML = `${iconCheck} 已存入 <span style="opacity:0.55;font-size:12px;margin-left:1px;">×</span>`;
      btn.title = '点击从笔记中删除';
    } else {
      btn.className = 'save-btn';
      btn.innerHTML = `${iconNote} 存入原笔记`;
      btn.title = '';
    }
  }
  render();

  btn.addEventListener('click', async () => {
    btn.disabled = true;

    if (!msgObj.savedToNote) {
      btn.textContent = '保存中…';
      const msgs    = state.conversation.messages;
      const myIdx   = msgs.indexOf(msgObj);
      const userMsg = myIdx > 0
        ? [...msgs.slice(0, myIdx)].reverse().find(x => x.role === 'user')
        : null;
      try {
        const res  = await fetch(`${API_BASE}/api/lab/${encodeURIComponent(state.conversation.labFileId)}/discuss`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: userMsg?.content || '', answer: msgObj.content }),
        });
        const data = await res.json();
        msgObj.savedToNote  = true;
        msgObj.savedNoteKey = data.dateStr;
        showToast('已存入原笔记');
        persistConversation();
      } catch {
        showToast('保存失败，请重试');
      }
    } else {
      btn.textContent = '删除中…';
      try {
        await fetch(`${API_BASE}/api/lab/${encodeURIComponent(state.conversation.labFileId)}/discuss`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'remove', dateStr: msgObj.savedNoteKey }),
        });
        msgObj.savedToNote  = false;
        msgObj.savedNoteKey = null;
        showToast('已从笔记删除');
        persistConversation();
      } catch {
        showToast('删除失败，请重试');
      }
    }
    render();
  });

  return btn;
}

function buildNoteSavedNode(m) {
  const wrap = document.createElement('div');
  wrap.className = 'note-action-confirm';
  wrap.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已存入笔记`;
  if (m._dateStr && m._filename) {
    const undo = document.createElement('button');
    undo.className = 'note-action-undo';
    undo.textContent = '撤销';
    undo.addEventListener('click', async () => {
      undo.disabled = true;
      try {
        await fetch(`${API_BASE}/api/lab/${encodeURIComponent(m._filename)}/discuss`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'remove', dateStr: m._dateStr }),
        });
        wrap.innerHTML = '<span style="opacity:0.5">已撤销</span>';
      } catch { showToast('撤销失败'); undo.disabled = false; }
    });
    wrap.appendChild(undo);
  }
  return wrap;
}

function buildNoteModifiedNode(m) {
  const wrap = document.createElement('div');
  wrap.className = 'note-action-confirm';
  wrap.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 笔记已更新`;
  if (m._backup && m._filename) {
    const undo = document.createElement('button');
    undo.className = 'note-action-undo';
    undo.textContent = '撤销';
    undo.addEventListener('click', async () => {
      undo.disabled = true;
      try {
        await fetch(`${API_BASE}/api/lab/${encodeURIComponent(m._filename)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body: m._backup }),
        });
        wrap.innerHTML = '<span style="opacity:0.5">已撤销</span>';
      } catch { showToast('撤销失败'); undo.disabled = false; }
    });
    wrap.appendChild(undo);
  }
  return wrap;
}

async function autoSaveToNote(filename, question, answer) {
  try {
    const r = await fetch(`${API_BASE}/api/lab/${encodeURIComponent(filename)}/discuss`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, answer }),
    });
    const data = await r.json();
    const msg = { role: 'ai', content: '__note-saved__', _filename: filename, _dateStr: data.dateStr };
    state.conversation.messages.push(msg);
    renderMessages();
    persistConversation();
  } catch { showToast('自动保存失败'); }
}

async function autoModifyNote(filename, userMsg, aiResponse) {
  const workingMsg = { role: 'ai', content: '正在根据对话更新笔记…' };
  state.conversation.messages.push(workingMsg);
  renderMessages();

  try {
    // Get current body
    const noteRes = await fetch(`${API_BASE}/api/lab/${encodeURIComponent(filename)}`);
    const noteData = await noteRes.json();
    const backup = noteData.body;

    // Build history for rewrite (last 10 non-special messages)
    const history = state.conversation.messages
      .filter(m => !['__remind-picker__','__note-saved__','__note-modified__'].includes(m.content) && m.content !== '正在根据对话更新笔记…')
      .slice(-10)
      .map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.content }));

    const rwRes = await fetch(`${API_BASE}/api/lab/${encodeURIComponent(filename)}/rewrite`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ currentBody: backup, history }),
    });
    const rwData = await rwRes.json();

    await fetch(`${API_BASE}/api/lab/${encodeURIComponent(filename)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ body: rwData.body }),
    });

    const idx = state.conversation.messages.indexOf(workingMsg);
    state.conversation.messages[idx] = { role: 'ai', content: '__note-modified__', _filename: filename, _backup: backup };
    renderMessages();
    persistConversation();
  } catch {
    const idx = state.conversation.messages.indexOf(workingMsg);
    state.conversation.messages[idx] = { role: 'ai', content: '笔记更新失败，请重试。' };
    renderMessages();
  }
}

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.style.width = '100%';

  const OPTS = [
    { label: '今天',    days: 0 },
    { label: '明天',    days: 1 },
    { label: '下周',    days: 7 },
    { label: '暂不提醒', days: null },

  const picker = document.createElement('div');
  picker.className = 'remind-picker';

  const label = document.createElement('div');
  label.className = 'remind-label';
  label.textContent = '想法已记录，什么时候提醒你？';
  picker.appendChild(label);

  const opts = document.createElement('div');
  opts.className = 'remind-options';

  OPTS.forEach(({ label: lbl, days }) => {
    const btn = document.createElement('button');
    btn.className = 'remind-opt';

    btn.addEventListener('click', async () => {
      opts.querySelectorAll('.remind-opt').forEach(b => b.disabled = true);
      btn.classList.add('selected');
      btn.textContent = lbl + ' …';

      const remind = days !== null ? offsetDate(days) : null;
      try {
        const r    = await fetch(`${API_BASE}/api/capture`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: msgObj._captureContent, remind }),

        const data = await r.json();

        // Anchor this conversation to the newly created lab file
        if (data.id) {
          state.conversation.labFileId = data.id;
          // Give the conversation a title based on the idea content
          const ideaTitle = msgObj._captureContent.length > 20
            ? msgObj._captureContent.slice(0, 20) + '…'
            : msgObj._captureContent;
          state.conversation.title = ideaTitle;
          chatTitleEl.textContent  = ideaTitle;
        }
      } catch { /* silently fail */ }

      // Replace picker with confirmation
      picker.innerHTML = '';
      const confirm = document.createElement('div');
      confirm.className = 'remind-confirm';
      confirm.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>

  return bubble;

/* =========================================================
   Send message (SSE streaming)
   ========================================================= */
let isStreaming      = false;
let isComposing      = false;
let abortController  = null;
let pendingQuote     = null;

function setStreamingUI(on) {
  isStreaming = on;
  sendBtn.style.display = on ? 'none' : 'flex';
  stopBtn.style.display = on ? 'flex' : 'none';
  if (!on) sendBtn.disabled = chatInputEl.value.trim().length === 0;
}

async function sendMessage(text) {
  const content = text.trim();
  if (!content || isStreaming) return;

  // Capture mode: save directly to lab/, no remind picker
  if (state.captureMode) {
    try {
      await fetch(`${API_BASE}/api/capture`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content }),
      });
      showToast('已存入 Lab ⚡');
    } catch { showToast('保存失败'); }
    setCaptureMode(false);
    return;
  }

  // Push user message
  state.conversation.messages.push({ role: 'user', content });
  if (state.conversation.title === '新对话') {
    state.conversation.title = content.length > 18 ? content.slice(0, 18) + '…' : content;
    chatTitleEl.textContent = state.conversation.title;
  }

  // Build history for API (exclude current question; map ai→assistant)
  const priorMsgs = state.conversation.messages.slice(0, -1).map(m => ({
    role: m.role === 'ai' ? 'assistant' : 'user',
    content: m.content,
  }));
  const history = state.conversation.labContext
    ? [
        { role: 'user',      content: `以下是我的一篇笔记，请优先基于它回答我的问题：\n\n${state.conversation.labContext}` },
        { role: 'assistant', content: '好的，我已阅读这篇笔记，请提问。' },
        ...priorMsgs,
      ]
    : priorMsgs;

  // Add thinking placeholder
  const aiMsg = { role: 'ai', content: '…', sources: [] };
  state.conversation.messages.push(aiMsg);
  renderMessages();

  setStreamingUI(true);
  abortController = new AbortController();

  let rawText = '';

  try {
    const res = await fetch(`${API_BASE}/api/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: content, history }),
      signal: abortController.signal,
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer    = '';
    let started   = false;

    const getLastBubble = () => {
      const nodes = chatScroll.querySelectorAll('.msg.ai .bubble.md');
      return nodes[nodes.length - 1] || null;
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let json;
        try { json = JSON.parse(line.slice(6)); } catch { continue; }

        if (json.type === 'sources') {
          aiMsg.sources = json.sources || [];
        } else if (json.type === 'delta') {
          if (!started) { started = true; }
          rawText += json.text;
          aiMsg.content = rawText;
          const bubble = getLastBubble();
          if (bubble) {
            bubble.innerHTML = window.marked ? marked.parse(rawText) : escapeHtml(rawText);
          }
          scrollToBottom();
        } else if (json.type === 'done') {
          aiMsg.content = rawText;
          renderMessages();
          persistConversation();
          if (hasReminderIntent(content) || hasReminderIntent(rawText)) {
            const pickerMsg = { role: 'ai', content: '__remind-picker__', _captureContent: rawText };
            state.conversation.messages.push(pickerMsg);
            renderMessages();
          }
          const labFile = state.conversation.labFileId;
          if (labFile) {
            if (hasModifyIntent(content)) {
              autoModifyNote(labFile, content, rawText);
            } else if (hasSaveIntent(content)) {
              autoSaveToNote(labFile, content, rawText);
            }
          }
        } else if (json.type === 'error') {
          aiMsg.content = `出错了：${json.message || '未知错误'}`;
          renderMessages();
        }
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      // Keep whatever was streamed; finalize cleanly
      if (rawText) {
        aiMsg.content = rawText;
        renderMessages();
        persistConversation();
      } else {
        state.conversation.messages.pop(); // remove empty placeholder
        renderMessages();
      }
    } else {
      aiMsg.content = '请求失败，请检查服务是否运行。';
      renderMessages();
      console.error(err);
    }
  }

  abortController = null;
  setStreamingUI(false);
}

function measureAndApplyPosition() {
  // Measure toolbar height while input bars are still visible
  const ref  = homeInputWrap.offsetParent !== null ? homeInputWrap : chatInputWrap;
  const rect = ref.getBoundingClientRect();
  imagToolbarH = Math.max(0, window.innerHeight - rect.bottom);
  applyImagPanelPosition();
}

function applyImagPanelPosition() {
  // Use cached toolbar height; adjust panel height for keyboard via visualViewport
  const vvH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  imagPanel.style.bottom    = imagToolbarH + 'px';
  imagPanel.style.maxHeight = Math.floor((vvH - imagToolbarH) * 0.95) + 'px';
}

function openImagPanel() {
  measureAndApplyPosition();           // measure toolbar BEFORE hiding inputs
  homeInputWrap.style.display = 'none';
  chatInputWrap.style.display = 'none';
  window.visualViewport?.addEventListener('resize', applyImagPanelPosition);
  imagOverlay.classList.add('visible');
  imagPanel.classList.add('visible');
  document.body.style.overflow = 'hidden';
  imagPanelMode = 'default';
  imagCurrentFile = null;
  renderImagBody();
  startImagCarousel();
  fetchImaginations();
}

function closeImagPanel() {
  window.visualViewport?.removeEventListener('resize', applyImagPanelPosition);
  imagPanel.style.bottom    = '';
  imagPanel.style.maxHeight = '';
  imagOverlay.classList.remove('visible');
  imagPanel.classList.remove('visible');
  homeInputWrap.style.display = '';
  chatInputWrap.style.display = '';
  document.body.style.overflow = '';

  try {

    renderImagCarousel();

}

function startImagCarousel() {
  clearImagCarousel();
  imagCarouselTimer = setInterval(() => {
    if (imaginations.length > 1) {
      imagCarouselIdx = (imagCarouselIdx + 1) % imaginations.length;
      renderImagCarousel();
    }
  }, 8000);

function clearImagCarousel() {
  if (imagCarouselTimer) { clearInterval(imagCarouselTimer); imagCarouselTimer = null; }
}

function renderImagCarousel() {
  const el = $('#imag-carousel-title');
  const dotsEl = $('#imag-carousel-dots');

  const item = imaginations[imagCarouselIdx];
  el.style.opacity = '0';
  setTimeout(() => {
    el.textContent = item.title;
    el.style.opacity = '1';

    dotsEl.innerHTML = imaginations.slice(0, 5).map((_, i) =>
      `<span class="imag-dot${i === imagCarouselIdx % Math.min(imaginations.length,5) ? ' active' : ''}"></span>`

    const titleEl   = $('#imag-new-title');
    const contentEl = $('#imag-new-content');
    const title = titleEl?.value.trim();
    if (!title) { titleEl?.focus(); showToast('请输入标题'); return; }
    imagBtnSave.disabled = true;
    try {
      const r    = await fetch(`${API_BASE}/api/imaginations`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content: contentEl?.value.trim() || '' }),
      });
      const data = await r.json();
      await fetchImaginations();
      refreshHomeCarousel();
      imagCurrentFile = data.id;
      imagPanelMode = 'default';
      renderImagBody();
      showToast('想法已保存 ✓');
    } catch { showToast('保存失败'); }
    imagBtnSave.disabled = false;
    return;
  }

  // default mode: save essay text
  const textarea = $('#imag-textarea');
  const text = textarea?.value.trim();
  if (!text) { textarea?.focus(); showToast('请先写点什么'); return; }
  imagBtnSave.disabled = true;
  try {
    if (imagCurrentFile) {
      await fetch(`${API_BASE}/api/imaginations/${encodeURIComponent(imagCurrentFile)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
    } else {
      // answer to deep question → save as new imagination note
      const q = state.reviewQuestion || '随笔';
      await fetch(`${API_BASE}/api/imaginations`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: q.replace(/[？?]$/, '').slice(0, 30), content: text }),
      });
      await fetchImaginations();
      refreshHomeCarousel();
    }
    if (textarea) textarea.value = '';
    showToast('已保存到 imaginations ✓');
  } catch { showToast('保存失败'); }
  imagBtnSave.disabled = false;
});

imagCloseBtn.addEventListener('click', closeImagPanel);
imagOverlay.addEventListener('click', closeImagPanel);
reviewRightEl.addEventListener('click', openImagPanel);

/* =========================================================
   Events: Chat
   ========================================================= */
backBtn.addEventListener('click', () => {
  closeDrawer();
  state.conversation.labContext = null;
  chatContextBar.style.display = 'none';
  goPage('home');
});

function autoResize() {
  chatInputEl.style.height = 'auto';
  chatInputEl.style.height = Math.min(chatInputEl.scrollHeight, 120) + 'px';
}

chatInputEl.addEventListener('compositionstart', () => { isComposing = true; });
chatInputEl.addEventListener('compositionend',   () => { isComposing = false; });

chatInputEl.addEventListener('input', () => {
  autoResize();
  sendBtn.disabled = chatInputEl.value.trim().length === 0 || isStreaming;
});

function collectInput() {
  const v = chatInputEl.value;
  chatInputEl.value = '';
  autoResize();
  sendBtn.disabled = true;
  const full = pendingQuote ? `「${pendingQuote}」\n\n${v}` : v;
  clearQuote();
  return full;
}

chatInputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !isComposing) {
    e.preventDefault();
    if (!sendBtn.disabled) sendMessage(collectInput());
  }
});

sendBtn.addEventListener('click', () => {
  if (sendBtn.disabled) return;
  sendMessage(collectInput());
});

captureToggle.addEventListener('click', () => setCaptureMode(!state.captureMode));
stopBtn.addEventListener('click', () => abortController?.abort());

/* =========================================================
   Events: Drawer

drawerMask.addEventListener('click', closeDrawer);
drawerClose.addEventListener('click', closeDrawer);
chatContextBar.addEventListener('click', () => {
  if (currentLabItem) openLabDrawer(currentLabItem);
});

drawerChatBtn.addEventListener('click', () => {
  if (!currentLabItem) return;

  closeDrawer();

/* =========================================================
   Mode switcher
   ========================================================= */
const exploreScroll  = $('#explore-scroll');
const lightningScroll = $('#lightning-scroll');
const modeLabelEl    = $('#mode-label');
const modeIconEl     = $('#mode-icon');
const modeToggleBtn  = $('#mode-toggle');

const ICON_LIGHTNING = `<path d="M13 2L4.09 13H11L10 22L20.91 11H14L13 2Z"/>`;
const ICON_EXPLORE   = `<circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>`;

function setMode(mode) {
  state.mode = mode;
  if (mode === 'explore') {
    modeLabelEl.textContent = 'Explore';
    modeIconEl.innerHTML = ICON_LIGHTNING;
    modeIconEl.setAttribute('fill', 'currentColor');
    exploreScroll.style.display  = '';
    lightningScroll.style.display = 'none';
    homeInputEl.placeholder = '问点什么，或记录一个想法…';
  } else {
    modeLabelEl.textContent = 'Lightning';
    modeIconEl.innerHTML = ICON_EXPLORE;
    modeIconEl.setAttribute('fill', 'none');
    exploreScroll.style.display  = 'none';
    lightningScroll.style.display = '';
    homeInputEl.placeholder = 'Flash an idea…';
    renderLab();
  }
}

modeToggleBtn.addEventListener('click', () => {
  setMode(state.mode === 'explore' ? 'lightning' : 'explore');
});

/* =========================================================
   Lab (Lightning mode)
   ========================================================= */
const labGrid = $('#lab-grid');

function labStatusLabel(s) {
  return { incubating: 'Active', done: 'Done', shelved: 'Shelved' }[s] || s;
}
function labStatusClass(s) {
  return { incubating: 's-incubating', done: 's-done', shelved: 's-shelved' }[s] || 's-incubating';
}
function formatLabDate(str) {
  if (!str) return '';
  const [, m, d] = str.split('-');
  return `${+m}/${+d}`;
}

async function renderLab() {
  labGrid.innerHTML = `<div style="font-size:13px;color:var(--text-3);padding:20px 4px;">加载中…</div>`;
  let ideas = [];
  try {
    const res = await fetch(`${API_BASE}/api/lab`);
    ideas = await res.json();
  } catch {
    labGrid.innerHTML = `<div style="font-size:13px;color:var(--text-3);padding:20px 4px;">无法加载</div>`;
    return;
  }
  if (ideas.length === 0) {
    labGrid.innerHTML = `<div style="font-size:13px;color:var(--text-3);padding:20px 4px;">还没有想法，用下方输入框记录第一条吧</div>`;
    return;
  }

  // Group: '' = root, otherwise folder name
  const groups = {};
  ideas.forEach(item => {
    const key = item.folder || '';
    if (!groups[key]) groups[key] = [];
    groups[key].push(item);
  });
  // Root first, then folders alphabetically
  const keys = ['', ...Object.keys(groups).filter(k => k).sort()];

  labGrid.innerHTML = '';
  const allItems = []; // flat ordered list for click-index lookup

  keys.forEach(key => {
    const group = groups[key];
    if (!group) return;

    if (key) {
      const hdr = document.createElement('div');
      hdr.className = 'lab-section-header';
      hdr.textContent = key.split('/').pop(); // show only deepest folder name
      labGrid.appendChild(hdr);
    }

    group.forEach(item => {
      allItems.push(item);
      const card = document.createElement('div');
      card.className = `lab-card${item.status === 'shelved' ? ' is-shelved' : ''}`;
      card.dataset.id = item.id;
      card.innerHTML = `
        <span class="lab-status ${escapeHtml(labStatusClass(item.status))}">${escapeHtml(labStatusLabel(item.status))}</span>
        <div class="lab-card-title">${escapeHtml(item.title)}</div>
        ${item.preview ? `<div class="lab-card-preview">${escapeHtml(item.preview)}</div>` : ''}
        <div class="lab-card-footer">
          <span class="lab-card-meta">
            ${escapeHtml(formatLabDate(item.created))}${item.discussionCount ? ` · ${item.discussionCount}条` : ''}
          </span>
          <div class="lab-card-actions">
            ${item.status !== 'done'    ? `<button class="lab-action done-btn"  data-id="${escapeHtml(item.id)}">完成</button>` : ''}
            ${item.status !== 'shelved' ? `<button class="lab-action shelf-btn" data-id="${escapeHtml(item.id)}">搁置</button>` : ''}
          </div>
        </div>`;

      card.addEventListener('click', e => {
        if (e.target.closest('.lab-action')) return;
        openLabDrawer(item);
      });
      card.querySelector('.done-btn')?.addEventListener('click', async e => {
        e.stopPropagation();
        e.target.textContent = '…'; e.target.disabled = true;
        await patchReminder(item.id, { status: 'done' });
        renderLab();
      });
      card.querySelector('.shelf-btn')?.addEventListener('click', async e => {
        e.stopPropagation();
        e.target.textContent = '…'; e.target.disabled = true;
        await patchReminder(item.id, { status: 'shelved' });
        renderLab();
      });
      labGrid.appendChild(card);
    });
  });
}

function openLabChat(item) {
  state.conversation.id        = 'c' + Date.now();
  state.conversation.title     = item.title.length > 18 ? item.title.slice(0, 18) + '…' : item.title;
  state.conversation.messages  = [];
  state.conversation.labFileId = item.id;
  state.conversation.labContext = item.content;
  chatTitleEl.textContent      = state.conversation.title;
  chatContextTitle.textContent = item.title;
  chatContextBar.style.display = '';
  renderMessages();
  goPage('chat');
}

function openLabDrawer(item) {
  currentLabItem = item;
  drawerTitle.textContent = item.title;
  drawerMeta.innerHTML =
    `<span style="display:inline-block;font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-right:6px;" class="lab-status ${labStatusClass(item.status)}">${labStatusLabel(item.status)}</span>` +
    `${item.created || ''}` +
    (item.discussionCount ? ` · ${item.discussionCount} note${item.discussionCount > 1 ? 's' : ''}` : '');
  drawerBody.innerHTML = window.marked ? marked.parse(item.content) : escapeHtml(item.content);
  drawerChatBtn.style.display = '';
  drawer.classList.add('open');
  drawerMask.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
}

async function captureIdea(content) {
  try {
    await fetch(`${API_BASE}/api/capture`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    showToast('Saved ⚡');
    renderLab();
  } catch {
    showToast('保存失败');
  }
}

/* =========================================================
   Selection quote
   ========================================================= */
const quoteBtn   = $('#quote-btn');
const quoteBlock = $('#quote-block');

function setQuote(text) {
  pendingQuote = text;
  quoteBlock.style.display = 'flex';
  quoteBlock.className = 'quote-block';
  quoteBlock.innerHTML = `
    <span class="quote-block-text">${escapeHtml(text)}</span>
    <button class="quote-dismiss" title="取消引用">×</button>`;
  quoteBlock.querySelector('.quote-dismiss').addEventListener('click', clearQuote);
  chatInputEl.focus();
}

function clearQuote() {
  pendingQuote = null;
  quoteBlock.style.display = 'none';
  quoteBlock.innerHTML = '';
}

// Show floating button on selection within a chat bubble
document.addEventListener('mouseup', e => {
  // Don't steal clicks from the quote button itself
  if (e.target === quoteBtn) return;

  const sel = window.getSelection();
  const text = sel?.toString().trim();

  if (!text) { hideQuoteBtn(); return; }

  // Confirm selection is inside a chat message bubble
  const range = sel.getRangeAt(0);
  const container = range.commonAncestorContainer;
  const bubble = (container.nodeType === Node.TEXT_NODE ? container.parentElement : container)
    .closest('.bubble');
  if (!bubble) { hideQuoteBtn(); return; }

  // Position button just above the end of the selection
  const rect = range.getBoundingClientRect();
  quoteBtn.style.left = `${rect.left + rect.width / 2 - quoteBtn.offsetWidth / 2}px`;
  quoteBtn.style.top  = `${rect.top - 36 + window.scrollY}px`;
  quoteBtn.classList.add('visible');
  quoteBtn._pendingText = text;
});

// Hide when clicking elsewhere (but not when clicking quote button)
document.addEventListener('mousedown', e => {
  if (e.target !== quoteBtn) hideQuoteBtn();
});

function hideQuoteBtn() {
  quoteBtn.classList.remove('visible');
  quoteBtn._pendingText = null;
}

quoteBtn.addEventListener('mousedown', e => {
  e.preventDefault(); // prevent selection from clearing before we read it
});

quoteBtn.addEventListener('click', () => {
  const text = quoteBtn._pendingText || window.getSelection()?.toString().trim();
  if (!text) return;
  setQuote(text);
  hideQuoteBtn();
  window.getSelection()?.removeAllRanges();
});
